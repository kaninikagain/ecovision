<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" fill="none">
  <!-- Small decorative tropical leaf cluster for top-right corner -->
  <g opacity="0.9" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.5))">
    <!-- Main stem -->
    <path d="M160 0 C 135 25, 105 60, 80 110" stroke="#144624" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Top small leaf -->
    <path d="M150 0 C 120 10, 100 35, 95 65 C 115 55, 138 35, 150 0 Z" fill="#2E7D32"/>
    <path d="M150 0 C 125 22, 110 45, 95 65" stroke="#1B5E20" stroke-width="1.5"/>

    <!-- Accent bright leaf -->
    <path d="M160 30 C 130 35, 105 55, 90 90 C 110 85, 135 65, 160 30 Z" fill="#43A047"/>
    <path d="M160 30 C 130 50, 110 70, 90 90" stroke="#2E7D32" stroke-width="1.5"/>

    <!-- Hanging leaf -->
    <path d="M125 70 C 100 85, 80 110, 70 140 C 90 130, 110 110, 125 70 Z" fill="#2E7D32"/>
    <path d="M125 70 C 105 92, 90 115, 70 140" stroke="#1B5E20" stroke-width="1.5"/>

    <!-- Small side leaf -->
    <path d="M155 75 C 135 85, 120 105, 110 130 C 125 125, 142 110, 155 75 Z" fill="#66BB6A"/>
  </g>
</svg>
